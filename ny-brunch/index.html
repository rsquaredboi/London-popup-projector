<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash the Quiet — Nancy NY Brunch</title>
<style>
  /* Self-hosted so the deck runs with no network at the venue.
     Fraunces + Anton — the same pairing as the London deck. */
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Anton-normal-400.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/Fraunces-normal-600.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/Fraunces-normal-900.woff2) format('woff2')}

  :root{
    /* sampled from the postcard's own vector artwork */
    --pink:#EF538E; --pink2:#D9376F; --pink-lt:#F8A9C4;
    --marigold:#FBC829; --marigold-dk:#E0AA10;
    --chartreuse:#9CCB3B; --sage:#B7C0A8;
    --cream:#FDF6E7; --ink:#2A0A1E; --white:#FFFFFF;
    --disp:'Fraunces',Georgia,serif; --cond:'Anton',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);font-family:var(--disp);cursor:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;background:transparent;z-index:2}
  .q{font-family:var(--disp);font-weight:900;line-height:.95;letter-spacing:-.015em;padding:0 7vw;max-width:90vw}
  .qb{display:flex;flex-direction:column;align-items:center;gap:2.4vh;max-width:92vw;padding:0 4vw;
    position:relative;z-index:3}
  .by{font-family:var(--cond);font-size:2.7vh;letter-spacing:.05em;text-transform:uppercase;
    padding:.5vh 1.8vh;border-radius:999px;background:var(--ink);color:var(--cream);white-space:nowrap}
  .c4 .by,.c6 .by,.c8 .by,.c9 .by{background:var(--marigold);color:var(--ink)}

  /* ===== GROUNDS — flat brand colour per concept, as the original does ===== */
  #bg{position:fixed;inset:0;z-index:0;transition:background .6s ease}
  .bg0,.bg3{background:var(--pink)} .bg1,.bg7{background:var(--marigold)} .bg2{background:var(--cream)}
  .bg4,.bg8{background:var(--pink2)} .bg5{background:var(--chartreuse)} .bg6{background:#1B0713}
  .bg9{background:#12040C}
  .bg10{background:radial-gradient(120% 90% at 50% 22%,#F76BA4 0%,var(--pink) 48%,var(--pink2) 100%)}
  .bg11{background:var(--ink)}

  /* ===== BRAND CHROME (persistent) ===== */
  #logo{position:fixed;left:50%;top:1.4vh;transform:translateX(-50%);z-index:60;pointer-events:none}
  #logo img{height:8.2vh;display:block;
    filter:drop-shadow(2px 3px 0 rgba(42,10,30,.5)) drop-shadow(1.4px 0 0 rgba(42,10,30,.45))
           drop-shadow(-1.4px 0 0 rgba(42,10,30,.45)) drop-shadow(0 1.4px 0 rgba(42,10,30,.45))
           drop-shadow(0 -1.4px 0 rgba(42,10,30,.45))}
  .mascot{position:fixed;right:22px;top:14px;width:104px;height:auto;z-index:60;
    animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  .corner{position:fixed;z-index:2;opacity:.5;pointer-events:none}
  .cBall{left:26px;bottom:9.5vh;width:84px}

  /* The bottom-right slot the original gives its rotating pin. Here it carries
     the product shoot — a different frame on every concept, so the photography
     runs through the whole loop instead of sitting in one place. */
  #shot{position:fixed;right:2vw;bottom:9.4vh;height:15.5vh;z-index:5;pointer-events:none;
    border-radius:1.1vh;object-fit:cover;box-shadow:0 1.4vh 2.8vh rgba(42,10,30,.42);
    border:.42vh solid var(--cream);animation:pinpop .6s cubic-bezier(.2,1.5,.35,1) both}
  @keyframes pinpop{0%{transform:scale(.4) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

  #foot{position:fixed;left:0;right:0;bottom:0;height:7.2vh;min-height:52px;background:var(--marigold);z-index:60;
    display:flex;align-items:center;overflow:hidden;border-top:3px solid var(--cream)}
  #foot .run{white-space:nowrap;font-family:var(--cond);color:var(--pink2);font-size:3.4vh;letter-spacing:.06em;
    animation:run 30s linear infinite;text-transform:uppercase}
  #foot .run span{padding:0 1.6vw}
  @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  #name{position:fixed;left:20px;top:16px;color:rgba(255,255,255,.8);font-family:var(--cond);
    font-size:14px;letter-spacing:.3em;text-transform:uppercase;z-index:61;mix-blend-mode:difference;
    transition:opacity .4s}
  #hud{position:fixed;left:0;right:0;bottom:8.4vh;text-align:center;color:rgba(0,0,0,.4);font-family:var(--cond);
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;z-index:61;transition:opacity .4s}
  .idle #hud,.idle #name{opacity:0}

  /* ===== CONCEPTS ===== */
  .c0 .q{color:var(--marigold);font-size:11vw;animation:slam .5s cubic-bezier(.2,1.4,.3,1) both}
  @keyframes slam{0%{transform:scale(2.3);opacity:0}100%{transform:scale(1);opacity:1}}

  .c2 .q{color:var(--pink2);font-size:10vw}
  .c2 .w{display:inline-block;transform-origin:50% 0;animation:flip .55s ease both}
  @keyframes flip{0%{transform:rotateX(-95deg);opacity:0}100%{transform:rotateX(0);opacity:1}}

  .c3 .q{color:var(--cream);font-size:10vw;position:relative;z-index:3;
    text-shadow:0 6px 26px rgba(42,10,30,.22)}
  .drop{position:absolute;top:-14vh;z-index:1;animation:fall linear infinite}
  .drop img{display:block;width:100%;height:auto}
  @keyframes fall{to{transform:translateY(128vh) rotate(300deg)}}

  .c4 .q{font-size:10vw;color:rgba(253,246,231,.22)}
  .c4 .w{transition:color .25s,text-shadow .25s}
  .c4 .w.on{color:var(--marigold);text-shadow:0 0 30px rgba(251,200,41,.55)}

  .c5 .q{color:var(--ink);font-size:10vw}

  .c6 .q{font-size:10vw;color:#ffe6f1;
    text-shadow:0 0 8px #ff6fb8,0 0 22px var(--pink),0 0 60px var(--pink),0 0 110px var(--pink2);
    animation:flick 3s infinite}
  @keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.4}}

  .c7 .q{font-size:9.5vw;line-height:1.04}
  .c7 .w{display:inline-block;margin:0 .12em;padding:.02em .2em;border-radius:9px}

  .c8{align-items:flex-start}
  .c8 .scroll{position:absolute;width:100%;text-align:center;animation:up 32s linear infinite}
  .c8 .scroll p{font-family:var(--disp);font-weight:900;font-size:6.6vh;color:var(--cream);
    padding:3vh 8vw;line-height:1.02}
  .c8 .scroll p:nth-child(3n){color:var(--marigold)}
  @keyframes up{0%{transform:translateY(100vh)}100%{transform:translateY(-100%)}}

  .c9 .q{font-size:11vw;color:var(--cream);position:relative;animation:gjit .18s steps(2) infinite}
  .c9 .q::before,.c9 .q::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;opacity:.85}
  .c9 .q::before{color:#ff2d9b;animation:gsh1 1.6s infinite linear alternate}
  .c9 .q::after{color:#a8e21f;animation:gsh2 1.9s infinite linear alternate}
  @keyframes gjit{0%{transform:translate(0)}50%{transform:translate(.4px,-.4px)}100%{transform:translate(-.3px,.3px)}}
  @keyframes gsh1{0%{clip-path:inset(0 0 82% 0);transform:translateX(-6px)}50%{clip-path:inset(46% 0 30% 0);transform:translateX(5px)}100%{clip-path:inset(78% 0 4% 0);transform:translateX(-4px)}}
  @keyframes gsh2{0%{clip-path:inset(70% 0 8% 0);transform:translateX(6px)}50%{clip-path:inset(20% 0 56% 0);transform:translateX(-5px)}100%{clip-path:inset(4% 0 80% 0);transform:translateX(4px)}}

  /* ===== OPENER (c10) — mirrors the original's truck slide ===== */
  .c10 .openslide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:6vh}
  .c10 .tline{font-family:var(--cond);color:var(--marigold);font-size:6.6vh;letter-spacing:.02em;
    text-transform:uppercase;text-align:center;line-height:.95;min-height:12.5vh;padding:0 6vw;
    text-shadow:3px 4px 0 var(--ink);animation:tlinein .5s cubic-bezier(.2,1.5,.35,1) both}
  .c10 .bigwm{height:17.5vh;margin-top:.2vh;filter:drop-shadow(5px 7px 0 rgba(42,10,30,.42));
    animation:wmpin .6s cubic-bezier(.2,1.5,.35,1) both}
  .c10 .unitwrap{position:absolute;left:0;right:0;bottom:7.6vh;display:flex;justify-content:center;
    animation:drivein 1.05s cubic-bezier(.18,.85,.2,1) both}
  .c10 .unitimg{height:46vh;filter:drop-shadow(0 16px 26px rgba(42,10,30,.4));
    animation:bobunit 3.6s ease-in-out infinite}
  @keyframes tlinein{0%{transform:translateY(-26px) scale(.82);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wmpin{0%{transform:scale(.55) rotate(-5deg);opacity:0}100%{transform:none;opacity:1}}
  @keyframes drivein{0%{transform:translateX(-118vw)}100%{transform:translateX(0)}}
  @keyframes bobunit{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* ===== THE SHOOT (c11) — the one place photography takes the frame ===== */
  .c11 .full{position:absolute;inset:0}
  .c11 .full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transition:opacity 1s ease;animation:kb 18s ease-out both}
  .c11 .full img.on{opacity:1}
  @keyframes kb{0%{transform:scale(1.03)}100%{transform:scale(1.13) translate(-1.2%,-1%)}}
  .c11 .cap{position:absolute;left:4vw;bottom:11vh;font-family:var(--cond);font-size:3vh;
    letter-spacing:.16em;text-transform:uppercase;color:var(--cream);
    text-shadow:0 .3vh 2vh rgba(42,10,30,.6);z-index:3}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="logo"><img src="art/wordmark.svg" alt="Nancy"></div>
<img class="mascot" src="art/ball-green.svg" alt="">
<div id="name"></div>
<img class="corner cBall" src="art/ball-pink.svg" alt="">
<div id="bg" class="bg10"></div>
<img id="shot" src="assets/court-ace-corner.jpg" alt="">
<div id="stage"></div>
<div id="hud">1–9 + 0 · T opener · S shoot · ←/→ line · space pause · F fullscreen</div>
<div id="foot"><div class="run"></div></div>

<script>
/* ============================================================================
   NANCY — NY BRUNCH PROJECTOR
   Built to the same shape as the London deck: a flat brand ground per concept,
   Fraunces slammed large, Anton on the chrome, and the same persistent
   furniture — wordmark top-centre, bobbing mascot top-right, corner sprite
   bottom-left, a rotating slot bottom-right, ticker along the foot.

   Two differences, both to carry this event's material: the bottom-right slot
   holds a frame from the product shoot rather than a pin, so the photography
   runs through every concept; and the opener drives in the wand the way the
   London deck drives in the truck.

   Engine contract: a concept's f() renders into #stage and returns a teardown
   that show() runs before the next one starts.
   ========================================================================== */

/* ---- CONTENT --------------------------------------------------------------
   Three independent lists. Adding a line to one adds it nowhere else. */

const SCRIPT = [
  "At this club, love means everything, and every point is yours to play.",
  "Start slow. Warm up. Take the long rally.",
  "Find the sweet spot nobody else can reach.",
  "Play singles or mixed doubles.",
  "Hold serve, or break it.",
  "No faults here. No lines you can't call.",
  "And when it's match point, take it.",
  "Advantage, you.",
  "Game. Set. Yours.",
  "Second serves are for tennis.",
  "With Nancy, one is enough.",
  "Love — Love. Not on our watch."
];

// The pill under each line, in the slot the original gives its attributions.
const CALLS = ["First serve","Long rally","Sweet spot","Mixed doubles","Break point",
               "No faults","Match point","Advantage","Game. Set. Yours.","Second serve",
               "One is enough","Love — Love"];

// Opener taglines, swapping over the wand the way London's swap over the truck.
const TAGS = ["SMASH THE QUIET","ACE THE POINT","SECOND SERVES ARE FOR TENNIS",
              "WITH NANCY, ONE IS ENOUGH","LOVE — LOVE. NOT ON OUR WATCH",
              "FIND THE SWEET SPOT","ADVANTAGE, YOU","GAME. SET. YOURS."];

// TODO: venue + date once confirmed.
const TICKER = ["Smash the Quiet","Ace the Point","Second serves are for tennis",
                "With Nancy, one is enough","Love — Love, not on our watch",
                "Advantage, you","Game. Set. Yours.","NY Brunch"];

/* ---- ASSETS --------------------------------------------------------------- */
const A = p => "assets/" + p;
// The shoot, landscape frames.
const SHOTS = ["court-ace-corner.jpg","court-ace-wide.jpg","court-ace-pink.jpg","court-ace-yellow.jpg",
               "court-smash.jpg","court-smash-wide.jpg","studio-ace-pink.jpg","studio-ace-solo.jpg",
               "studio-ace-yellow.jpg","studio-ball-yellow.jpg","studio-trio.jpg","studio-pile.jpg",
               "studio-pile-wide.jpg","flatlay-court.jpg","flatlay-fruit.jpg","flatlay-full.jpg",
               "flatlay-spread.jpg","racket-shadow.jpg","racket-balls.jpg","racket-flatlay.jpg",
               "net-smash.jpg","packaging.jpg","packaging-wide.jpg"];
// Portrait frames — shown upright in the bottom-right slot, never stretched.
const UPRIGHT = ["court-ace-tight.jpg","court-duo.jpg","flatlay-pair.jpg","studio-row.jpg","net-detail.jpg"];
const BALLS = ["art/ball-green.svg","art/ball-pink.svg","art/ball-green2.svg"];

[...SHOTS,...UPRIGHT].forEach(s => { new Image().src = A(s); });

/* ---- HELPERS -------------------------------------------------------------- */
const stage  = document.getElementById('stage'),
      nameEl = document.getElementById('name'),
      shotEl = document.getElementById('shot'),
      RANSOM = ['#EF538E','#FBC829','#FDF6E7','#2A0A1E','#9CCB3B'];

let li = 0, cur = 0, cleanup = null, autoTimer = null, paused = false;

const rand = a => a[Math.floor(Math.random() * a.length)];
const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

// Size off character count. Crude ladder, but it holds across the whole script —
// check any new line on the real display rather than trusting it.
function fitLen(el, t){
  if (!el) return;
  const n = (t || '').length;
  el.style.fontSize = (n < 13 ? 10.5 : n < 21 ? 8.5 : n < 31 ? 6.8 : n < 43 ? 5.4 : 4.6) + 'vw';
}
const fq = () => stage.querySelector('.q');
const words = s => s.split(' ');
const block = (inner, call) => `<div class="qb"><div class="q">${inner}</div><div class="by">${esc(call)}</div></div>`;

function cycle(render, ms){
  render(li);
  const id = setInterval(() => { li = (li + 1) % SCRIPT.length; render(li); }, ms);
  return () => clearInterval(id);
}

/* ---- CONCEPTS ------------------------------------------------------------- */

const C = [
  // 1 — the opener, mirroring the original's truck slide
  {n:'Opener', c:10, f:() => {
    let k = 0;
    stage.innerHTML = `<div class="openslide">
      <div class="tline">★ ${TAGS[0]} ★</div>
      <img class="bigwm" src="art/wordmark.svg" alt="Nancy">
      <div class="unitwrap"><img class="unitimg" src="art/wand-unit.svg" alt=""></div></div>`;
    const tl = stage.querySelector('.tline');
    const id = setInterval(() => {
      k = (k + 1) % TAGS.length;
      tl.style.animation = 'none'; void tl.offsetWidth; tl.style.animation = '';
      tl.textContent = '★ ' + TAGS[k] + ' ★';
    }, 2300);
    return () => clearInterval(id);
  }},

  {n:'Slam', c:0, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]), CALLS[i]);
    fitLen(fq(), SCRIPT[i]);
  }, 3800)},

  {n:'Split-flap', c:2, f:() => cycle(i => {
    stage.innerHTML = block(words(SCRIPT[i]).map((w,j) =>
      `<span class="w" style="animation-delay:${j*.07}s">${esc(w)}&nbsp;</span>`).join(''), CALLS[i]);
    fitLen(fq(), SCRIPT[i]);
  }, 3000)},

  // 4 — the original rains lemons; this rains the postcard's own balls
  {n:'Ball rain', c:3, f:() => {
    let drops = '';
    for (let i = 0; i < 24; i++){
      drops += `<div class="drop" style="left:${Math.random()*100}vw;width:${5+Math.random()*7}vh;` +
               `animation-duration:${3.4+Math.random()*4}s;animation-delay:${-Math.random()*7}s">` +
               `<img src="${BALLS[i % BALLS.length]}" alt=""></div>`;
    }
    const stop = cycle(i => {
      const old = stage.querySelector('.qb'); if (old) old.remove();
      stage.insertAdjacentHTML('beforeend', block(esc(SCRIPT[i]), CALLS[i]));
      fitLen(fq(), SCRIPT[i]);
    }, 3800);
    stage.insertAdjacentHTML('afterbegin', drops);
    return stop;
  }},

  {n:'Karaoke', c:4, f:() => {
    let t = [];
    const render = i => {
      stage.innerHTML = block(words(SCRIPT[i]).map(w => `<span class="w">${esc(w)}</span>`).join(' '), CALLS[i]);
      fitLen(fq(), SCRIPT[i]);
      stage.querySelectorAll('.q .w').forEach((w,j) => {
        t.push(setTimeout(() => w.classList.add('on'), 250 + j*240));
      });
    };
    render(li);
    const iv = setInterval(() => {
      t.forEach(clearTimeout); t = [];
      li = (li + 1) % SCRIPT.length; render(li);
    }, 4000);
    return () => { clearInterval(iv); t.forEach(clearTimeout); };
  }},

  {n:'Court', c:5, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]), CALLS[i]);
    fitLen(fq(), SCRIPT[i]);
  }, 3600)},

  {n:'Neon', c:6, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]), CALLS[i]);
    fitLen(fq(), SCRIPT[i]);
  }, 3800)},

  {n:'Ransom', c:7, f:() => cycle(i => {
    stage.innerHTML = block(words(SCRIPT[i]).map(w => {
      const fs  = (.78 + Math.random()*.8).toFixed(2);
      const rot = (Math.random()*14 - 7).toFixed(1);
      const bg  = rand(RANSOM);
      const fg  = (bg === '#FBC829' || bg === '#FDF6E7') ? '#2A0A1E' : '#FDF6E7';
      return `<span class="w" style="font-size:${fs}em;transform:rotate(${rot}deg);background:${bg};color:${fg}">${esc(w)}</span>`;
    }).join(''), CALLS[i]);
    fitLen(fq(), SCRIPT[i]);
  }, 2900)},

  {n:'Credits', c:8, f:() => {
    stage.innerHTML = `<div class="scroll">` + SCRIPT.map(t => `<p>${esc(t)}</p>`).join('') + `</div>`;
    return () => {};
  }},

  {n:'Glitch', c:9, f:() => cycle(i => {
    stage.innerHTML = `<div class="qb"><div class="q" data-t="${esc(SCRIPT[i])}">${esc(SCRIPT[i])}</div>` +
      `<div class="by">${esc(CALLS[i])}</div></div>`;
    fitLen(fq(), SCRIPT[i]);
  }, 3400)},

  // 0 — the one concept where the shoot takes the whole frame
  {n:'The shoot', c:11, f:() => {
    let k = Math.floor(Math.random() * SHOTS.length);
    stage.innerHTML = `<div class="full"></div><div class="cap">Smash &amp; Ace</div>`;
    const full = stage.querySelector('.full');
    const render = () => {
      const img = document.createElement('img');
      img.src = A(SHOTS[k % SHOTS.length]); img.alt = '';
      full.appendChild(img);
      requestAnimationFrame(() => img.classList.add('on'));
      while (full.children.length > 2) full.removeChild(full.firstChild);
    };
    render();
    const id = setInterval(() => { k++; render(); }, 3800);
    return () => clearInterval(id);
  }}
];

/* ---- LOOP ----------------------------------------------------------------- */

function show(i){
  if (cleanup) cleanup();
  cur = (i + C.length) % C.length;
  const cc = C[cur].c;
  stage.className = ''; void stage.offsetWidth; stage.className = 'c' + cc;
  document.getElementById('bg').className = 'bg' + cc;
  // The opener carries its own centred Nancy; the shoot wants a clean frame.
  document.getElementById('logo').style.display = (cc === 10 ? 'none' : 'block');
  document.querySelector('.mascot').style.display = (cc === 11 ? 'none' : 'block');
  const cb = document.querySelector('.cBall');
  cb.style.display = (cc === 11 ? 'none' : 'block');
  cb.src = [0,3,4,8,10].includes(cc) ? 'art/ball-green2.svg' : 'art/ball-pink.svg';

  // The bottom-right slot takes a different frame on every concept — upright
  // frames stand tall in it, landscape ones sit wide.
  if (cc === 10 || cc === 11 || cc === 8){   // opener, shoot and credits want a clear frame
    shotEl.style.display = 'none';
  } else {
    shotEl.style.display = 'block';
    const upright = cur % 3 === 1;
    shotEl.src = A(upright ? UPRIGHT[cur % UPRIGHT.length] : SHOTS[(cur * 5) % SHOTS.length]);
    shotEl.style.width = upright ? 'auto' : '27vh';
    shotEl.style.animation = 'none'; void shotEl.offsetWidth; shotEl.style.animation = '';
  }

  stage.innerHTML = '';
  nameEl.textContent = (cur + 1 < 10 ? '0' : '') + (cur + 1) + ' · ' + C[cur].n;
  cleanup = C[cur].f();
}

function nextC(){ show(cur + 1); }
function startAuto(){
  clearInterval(autoTimer);
  autoTimer = setInterval(() => { if (!paused) nextC(); }, 14000);
}

document.querySelector('#foot .run').innerHTML = (() => {
  const t = ' ★ ' + TICKER.join(' ★ ') + ' ';
  return `<span>${t}</span><span>${t}</span>`;
})();

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9'){ show(+e.key - 1); startAuto(); }
  else if (e.key === '0'){ show(9); startAuto(); }
  else if (e.key.toLowerCase() === 's'){ show(10); startAuto(); }
  else if (e.key === 'ArrowRight'){ li = (li + 1) % SCRIPT.length; show(cur); startAuto(); }
  else if (e.key === 'ArrowLeft'){ li = (li - 2 + SCRIPT.length) % SCRIPT.length; show(cur); startAuto(); }
  else if (e.key === ' '){ paused = !paused; e.preventDefault(); }
  else if (e.key.toLowerCase() === 't'){ show(0); startAuto(); }
  else if (e.key.toLowerCase() === 'f'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let idle;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add('idle'), 2500);
}
document.addEventListener('mousemove', wake);
document.addEventListener('keydown', wake);
wake();

show(0);
startAuto();
</script>
</body>
</html>
