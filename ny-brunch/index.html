<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash the Quiet — Nancy NY Brunch</title>
<style>
  /* Fonts are self-hosted so the deck runs with no network at the venue.
     Fraunces + Anton, matching the London deck. */
    @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Anton-normal-400.woff2) format('woff2')}
    @font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/Fraunces-normal-600.woff2) format('woff2')}
    @font-face{font-family:'Fraunces';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/Fraunces-normal-900.woff2) format('woff2')}

  /* ===== TOKENS — sampled from the postcard's own vector artwork ===== */
  :root{
    --pink:#EF538E; --pink-dp:#D9376F;
    --marigold:#FBC829; --white:#FFFFFF; --ink:#2A0A1E;
    --chartreuse:#9CCB3B;
    --disp:'Fraunces',Georgia,'Times New Roman',serif;
    --chrome:'Anton',Impact,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--pink);
    font-family:var(--disp);font-weight:600;cursor:none}

  /* ===== THE PINK WORLD =====
     One ground for the whole loop. Photography arrives as a guest, never as
     the default, so the deck reads as one piece rather than ten slides. */
  #ground{position:fixed;inset:0;z-index:0;background:var(--pink);transition:background .7s ease}

  #photo{position:fixed;inset:0;z-index:1;overflow:hidden;opacity:0;transition:opacity .9s ease}
  #photo.on{opacity:1}
  #photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transition:opacity 1s ease;animation:drift 20s ease-out both}
  #photo img.on{opacity:1}
  @keyframes drift{0%{transform:scale(1.03)}100%{transform:scale(1.13) translate(-1.2%,-1%)}}

  /* ===== PROPS — the postcard's furniture, kept across the whole loop ===== */
  .prop{position:fixed;z-index:2;pointer-events:none;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.9,.3,1)}
  .prop img{display:block;width:100%;height:auto}
  #pBallPink {right:-3.5vw;  top:-4vh;   width:26vh}
  #pWandUnit {right:4.2vw;   bottom:-9vh; width:23vh}
  #pBallLeft {left:-4vw;     bottom:9vh; width:24vh}
  #pBadge    {left:3.2vw;    top:4.6vh;  width:5.6vh}
  #pMark     {left:11.5vw;   bottom:8.4vh; width:19vh}
  .hide-props .prop:not(#pBadge){opacity:0}
  .no-mark #pMark{opacity:0}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.6vh) rotate(3deg)}}
  #pWandUnit,#pBallLeft{animation:bob 7s ease-in-out infinite}
  #pBallPink{animation:bob 9s ease-in-out infinite reverse}

  /* ===== TYPE ===== */
  #stage{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:12vh 12vw 15vh;overflow:hidden}
  .stack{display:flex;flex-direction:column;align-items:center;gap:2.4vh;max-width:76vw}
  .line{font-family:var(--disp);font-weight:900;line-height:.95;letter-spacing:-.015em;
    color:var(--marigold);text-wrap:balance}
  .line em{font-style:normal;color:var(--white)}
  .sub{font-family:var(--disp);font-weight:600;font-size:3.2vh;color:var(--white)}
  .sub .mk{display:inline-block;height:3.9vh;vertical-align:-.55vh;margin:0 .5vh}
  .sub .mk img{height:100%;width:auto;display:block}
  .kicker{font-family:var(--chrome);font-size:2.2vh;letter-spacing:.28em;
    text-transform:uppercase;color:var(--white);opacity:.9}
  .on-photo .line{color:var(--white);text-shadow:0 .2vh 2.6vh rgba(42,10,30,.42)}

  .al-l #stage{justify-content:flex-start;text-align:left;padding-left:8vw}
  .al-l .stack{align-items:flex-start}

  /* ===== TREATMENTS ===== */
  .c-open .line{font-size:8.8vw;animation:rise .95s cubic-bezier(.16,1,.3,1) both}
  .c-open .line:nth-child(2){animation-delay:.15s}
  @keyframes rise{0%{opacity:0;transform:translateY(2.2vh)}100%{opacity:1;transform:none}}

  .c-fade .line{animation:fadein 1s ease both}
  @keyframes fadein{0%{opacity:0;transform:translateY(1.2vh)}100%{opacity:1;transform:none}}

  .c-rally .w{display:inline-block;opacity:0;transform:translateY(1vh);
    animation:wordin .5s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes wordin{to{opacity:1;transform:none}}

  .c-score .board{display:flex;gap:1.2vh;justify-content:center;flex-wrap:wrap}
  .c-score .cell{font-family:var(--chrome);font-size:6.4vh;line-height:1;letter-spacing:.02em;
    padding:1.5vh 2vh;background:var(--marigold);color:var(--pink);border-radius:.8vh;
    transform-origin:50% 0;animation:flap .5s cubic-bezier(.2,1.3,.35,1) both}
  .c-score .cell.hi{background:var(--white);color:var(--pink-dp)}
  @keyframes flap{0%{transform:rotateX(-92deg);opacity:0}100%{transform:none;opacity:1}}

  /* The postcard itself, set in motion: headline, lockup, then the script. */
  .c-card #stage{padding:8vh 8vw 12vh}
  .c-card .stack{align-items:flex-start;text-align:left;gap:1.6vh;max-width:62vw}
  .c-card .line{font-size:5.2vw}
  .c-card .script{margin-top:2.4vh;display:flex;flex-direction:column;gap:.2vh}
  .c-card .script p{font-weight:600;font-size:2.4vh;line-height:1.32;color:var(--marigold);opacity:0;
    animation:fadein .7s ease forwards}
  .c-card .script p.last{margin-top:1.6vh}

  .c-point .line{font-size:12.4vw;line-height:.9;animation:slam .55s cubic-bezier(.2,1.35,.3,1) both}
  @keyframes slam{0%{opacity:0;transform:scale(1.85)}100%{opacity:1;transform:none}}

  .drop{position:absolute;z-index:2;top:-24vh;pointer-events:none;animation:fall linear infinite}
  .drop img{display:block;width:100%;height:auto}
  @keyframes fall{to{transform:translateY(140vh) rotate(340deg)}}

  .c-shots #stage{padding:0}
  .c-shots .cap{position:absolute;left:8vw;bottom:14vh;font-family:var(--chrome);
    font-size:2.2vh;letter-spacing:.34em;text-transform:uppercase;color:var(--white)}

  .c-masc .row{display:flex;gap:2.2vw;align-items:center;justify-content:center}
  .c-masc .card{height:60vh;border-radius:1.2vh;box-shadow:0 2.4vh 5vh rgba(42,10,30,.32);
    animation:pop .62s cubic-bezier(.2,1.5,.35,1) both}
  .c-masc .card:nth-child(2){animation-delay:.13s} .c-masc .card:nth-child(3){animation-delay:.26s}
  @keyframes pop{0%{opacity:0;transform:scale(.84)}100%{opacity:1;transform:none}}

  .c-cred #stage{align-items:flex-start;padding:0}
  .c-cred .scroll{position:absolute;width:100%;text-align:center;animation:up 32s linear infinite}
  .c-cred .scroll p{font-weight:900;font-size:5.2vh;line-height:1.16;padding:2.2vh 12vw;color:var(--marigold)}
  .c-cred .scroll p.w{color:var(--white)}
  @keyframes up{0%{transform:translateY(100vh)}100%{transform:translateY(-100%)}}

  /* ===== CHROME — the postcard's marigold footer bar ===== */
  #foot{position:fixed;left:0;right:0;bottom:0;height:6.2vh;min-height:44px;z-index:40;
    background:var(--marigold);display:flex;align-items:center;overflow:hidden}
  #foot .run{white-space:nowrap;font-family:var(--chrome);color:var(--pink-dp);
    font-size:2.4vh;letter-spacing:.24em;text-transform:uppercase;animation:run 48s linear infinite}
  #foot .run span{padding:0 2.2vw}
  @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  #name{position:fixed;right:1.6vw;top:2.2vh;z-index:41;font-family:var(--chrome);font-size:10px;
    letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);transition:opacity .45s}
  #hud{position:fixed;left:0;right:0;bottom:7.6vh;z-index:41;text-align:center;font-family:var(--chrome);
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45);
    transition:opacity .45s}
  .idle #name,.idle #hud{opacity:0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="ground"></div>
<div id="photo"></div>

<img class="prop" id="pBallPink"  src="art/ball-pink.svg"   alt="">
<img class="prop" id="pWandUnit"  src="art/wand-unit.svg"  alt="">
<img class="prop" id="pBallLeft"  src="art/ball-green2.svg" alt="">
<img class="prop" id="pBadge"     src="art/badge.svg"       alt="">
<img class="prop" id="pMark"      src="art/wordmark.svg"    alt="Nancy">

<div id="stage"></div>
<div id="name"></div>
<div id="hud">1–9 concept · ←/→ line · space pause · F fullscreen</div>
<div id="foot"><div class="run"></div></div>

<script>
/* ============================================================================
   NANCY — NY BRUNCH PROJECTOR
   The postcard, set in motion. One pink ground for the whole loop, the
   postcard's own vector artwork as persistent furniture, and the type doing
   the changing. Photography appears as a deliberate guest, not the default.

   Engine contract, same as the London deck: a concept's f() renders into
   #stage and returns a teardown that show() runs before the next one starts.
   ========================================================================== */

const SCRIPT = [
  "At this club, love means everything, and every point is yours to play.",
  "Start slow. Warm up. Take the long rally.",
  "Find the sweet spot nobody else can reach.",
  "Play singles or mixed doubles.",
  "Hold serve, or break it.",
  "No faults here. No lines you can't call.",
  "And when it's match point, take it.",
  "Advantage, you.",
  "Game. Set. Yours."
];

const SHOUTS = ["Advantage,<br><em>you.</em>", "Game.<br>Set.<br><em>Yours.</em>",
                "Match<br><em>point.</em>", "Take<br><em>it.</em>"];

// TODO: venue + date once confirmed.
const TICKER = ["Smash the Quiet", "Ace the Point", "Second serves are for tennis",
                "With Nancy, one is enough", "Love — Love, not on our watch",
                "Advantage, you", "Game. Set. Yours.", "NY Brunch"];

const A = p => "assets/" + p;
// The shoot, landscape frames — these full-bleed on a 16:9 projector.
const SHOTS = ["court-ace-corner.jpg","court-ace-wide.jpg","court-ace-pink.jpg","court-ace-yellow.jpg",
               "court-smash.jpg","court-smash-wide.jpg","studio-ace-pink.jpg","studio-ace-solo.jpg",
               "studio-ace-yellow.jpg","studio-ball-yellow.jpg","studio-trio.jpg","studio-pile.jpg",
               "studio-pile-wide.jpg","flatlay-court.jpg","flatlay-fruit.jpg","flatlay-full.jpg",
               "flatlay-spread.jpg","racket-shadow.jpg","racket-balls.jpg","racket-flatlay.jpg",
               "net-smash.jpg","packaging.jpg","packaging-wide.jpg"];
// Portrait frames — shown as cards, never stretched to fill.
const STRIP = ["court-ace-tight.jpg","court-duo.jpg","flatlay-pair.jpg","studio-row.jpg","net-detail.jpg"];
const HEROES  = ["hero-chartreuse.jpg","hero-pink.jpg","product-court.jpg"];
const MASCOTS = ["mascot-duo.jpg","mascot-trio.jpg","mascot-hero.jpg"];
[...SHOTS,...STRIP,...HEROES,...MASCOTS].forEach(s => { new Image().src = A(s); });

const stage  = document.getElementById('stage'),
      photo  = document.getElementById('photo'),
      nameEl = document.getElementById('name');

let li = 0, cur = 0, cleanup = null, autoTimer = null, paused = false;

const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pick = (a,i) => a[i % a.length];

function fit(el, text){
  const n = (text || '').replace(/<[^>]+>/g,'').length;
  el.style.fontSize = (n < 16 ? 8.8 : n < 26 ? 7.2 : n < 40 ? 5.9 : n < 56 ? 5 : 4.3) + 'vw';
}

// Photography is opt-in per concept — the pink ground is the default state.
let photoWipe = null;
function showPhoto(src){
  clearTimeout(photoWipe);            // a pending clear would wipe this image mid-fade
  photo.classList.add('on');
  const img = document.createElement('img');
  img.src = A(src); img.alt = '';
  photo.appendChild(img);
  requestAnimationFrame(() => img.classList.add('on'));
  while (photo.children.length > 2) photo.removeChild(photo.firstChild);
}
function clearPhoto(){
  photo.classList.remove('on');
  clearTimeout(photoWipe);
  photoWipe = setTimeout(() => { photo.innerHTML = ''; }, 900);
}

const MARK = '<span class="mk"><img src="art/wordmark.svg" alt="Nancy"></span>';

const C = [

  { n:'Opener', cls:'c-open', f(){
      stage.innerHTML = `<div class="stack">
        <div class="line">Smash the Quiet.</div>
        <div class="line"><em>Ace the Point.</em></div></div>`;
      return () => {};
  }},

  // The postcard, animated — headline, lockup, then the script line by line.
  { n:'The Postcard', cls:'c-card no-mark', f(){
      stage.innerHTML = `<div class="stack">
        <div class="line">Second Serves<br>are for Tennis.</div>
        <div class="sub">with ${MARK} one is enough.</div>
        <div class="script">` +
          SCRIPT.map((t,i) => `<p style="animation-delay:${.45 + i*.26}s"${i === SCRIPT.length-1 ? ' class="last"' : ''}>${esc(t)}</p>`).join('') +
        `</div></div>`;
      return () => {};
  }},

  { n:'Rally', cls:'c-rally', f(){
      const render = () => {
        const t = pick(SCRIPT, li);
        stage.innerHTML = `<div class="stack"><div class="line">` +
          t.split(' ').map((w,i) =>
            `<span class="w" style="animation-delay:${.1 + i*.075}s">${esc(w)}&nbsp;</span>`).join('') +
          `</div></div>`;
        fit(stage.querySelector('.line'), t);
      };
      render();
      const id = setInterval(() => { li++; render(); }, 5000);
      return () => clearInterval(id);
  }},

  { n:'Scoreboard', cls:'c-score', f(){
      const BOARDS = [
        [['LOVE',0],['—',0],['LOVE',0],['NOT ON OUR WATCH',1]],
        [['GAME',0],['SET',0],['YOURS',1]],
        [['ADV',0],['YOU',1]],
        [['40',0],['—',0],['LOVE',0],['MATCH POINT',1]]
      ];
      let k = 0;
      const render = () => {
        stage.innerHTML = `<div class="stack"><div class="board">` +
          BOARDS[k % BOARDS.length].map(([t,hi],i) =>
            `<div class="cell${hi ? ' hi' : ''}" style="animation-delay:${i*.1}s">${t}</div>`).join('') +
          `</div></div>`;
      };
      render();
      const id = setInterval(() => { k++; render(); }, 3400);
      return () => clearInterval(id);
  }},

  { n:'Match Point', cls:'c-point', f(){
      let k = 0;
      const render = () => { stage.innerHTML = `<div class="stack"><div class="line">${pick(SHOUTS,k)}</div></div>`; };
      render();
      const id = setInterval(() => { k++; render(); }, 3200);
      return () => clearInterval(id);
  }},

  // Balls fall as the postcard's own vector art, so they stay sharp at any size.
  { n:'Ball Rain', cls:'c-fade', f(){
      const BALLS = ['art/ball-green.svg','art/ball-pink.svg','art/ball-green2.svg'];
      const drops = [];
      for (let i = 0; i < 20; i++){
        const d = document.createElement('div');
        d.className = 'drop';
        d.style.left = (Math.random() * 100) + 'vw';
        d.style.width = (5 + Math.random() * 8) + 'vh';
        d.style.animationDuration = (4.6 + Math.random() * 4.6) + 's';
        d.style.animationDelay = (-Math.random() * 8) + 's';
        d.innerHTML = `<img src="${BALLS[i % BALLS.length]}" alt="">`;
        stage.appendChild(d); drops.push(d);
      }
      const t = pick(SCRIPT, li);
      stage.insertAdjacentHTML('beforeend',
        `<div class="stack" style="position:relative;z-index:4"><div class="line">${esc(t)}</div></div>`);
      fit(stage.querySelector('.line'), t);
      return () => drops.forEach(d => d.remove());
  }},

  // The one place photography takes the whole frame, uninterrupted by type.
  { n:'The Shoot', cls:'c-shots hide-props on-photo', f(){
      let k = Math.floor(Math.random() * SHOTS.length);   // start somewhere new each loop
      const render = () => {
        showPhoto(pick(SHOTS, k));
        stage.innerHTML = `<div class="cap">Smash &amp; Ace</div>`;
      };
      render();
      const id = setInterval(() => { k++; render(); }, 3800);
      return () => { clearInterval(id); clearPhoto(); };
  }},

  // Photography over the pink world's rules: white type, one script line, no props.
  { n:'On Court', cls:'c-fade hide-props on-photo no-mark al-l', f(){
      let k = 0;
      const render = () => {
        showPhoto(pick(SHOTS, k * 3 + 1));
        const t = pick(SCRIPT, li);
        stage.innerHTML = `<div class="stack"><div class="line">${esc(t)}</div></div>`;
        fit(stage.querySelector('.line'), t);
      };
      render();
      const id = setInterval(() => { li++; k++; render(); }, 5000);
      return () => { clearInterval(id); clearPhoto(); };
  }},

  // Portrait frames the projector can't full-bleed — the shoot's uprights and
  // the mascot art — shown as cards on the pink ground instead of stretched.
  { n:'The Strip', cls:'c-masc hide-props no-mark', f(){
      const SETS = [STRIP.slice(0,3), MASCOTS, STRIP.slice(2,5)];
      let k = 0;
      const render = () => {
        stage.innerHTML = `<div class="row">` +
          SETS[k % SETS.length].map(m => `<img class="card" src="${A(m)}" alt="">`).join('') + `</div>`;
      };
      render();
      const id = setInterval(() => { k++; render(); }, 4600);
      return () => clearInterval(id);
  }},

  { n:'Credits', cls:'c-cred no-mark', f(){
      stage.innerHTML = `<div class="scroll">` +
        SCRIPT.map((t,i) => `<p${i % 3 === 2 ? ' class="w"' : ''}>${esc(t)}</p>`).join('') +
        `<p class="w"><em>Smash the Quiet. Ace the Point.</em></p></div>`;
      return () => {};
  }}
];

function show(i){
  if (cleanup) cleanup();
  cur = (i + C.length) % C.length;
  const c = C[cur];
  const idle = document.body.classList.contains('idle') ? 'idle ' : '';
  document.body.className = idle + c.cls;
  if (!c.cls.includes('on-photo')) clearPhoto();
  stage.innerHTML = '';
  nameEl.textContent = String(cur + 1).padStart(2,'0') + ' · ' + c.n;
  cleanup = c.f();
}

function startAuto(){
  clearInterval(autoTimer);
  // The Postcard concept carries the full script, so it needs longer on screen.
  autoTimer = setInterval(() => { if (!paused) show(cur + 1); }, C[cur].n === 'The Postcard' ? 21000 : 15000);
}

document.querySelector('#foot .run').innerHTML = (() => {
  const t = ' ★ ' + TICKER.join(' ★ ') + ' ';
  return `<span>${t}</span><span>${t}</span>`;
})();

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9'){ show(+e.key - 1); startAuto(); }
  else if (e.key === '0'){ show(9); startAuto(); }
  else if (e.key === 'ArrowRight'){ li++; show(cur); startAuto(); }
  else if (e.key === 'ArrowLeft'){ li = (li - 1 + SCRIPT.length) % SCRIPT.length; show(cur); startAuto(); }
  else if (e.key === ' '){ paused = !paused; e.preventDefault(); }
  else if (e.key.toLowerCase() === 'f'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let idle;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add('idle'), 2500);
}
document.addEventListener('mousemove', wake);
document.addEventListener('keydown', wake);
wake();

show(0);
startAuto();
</script>
</body>
</html>
