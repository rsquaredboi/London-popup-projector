<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash the Quiet — Nancy NY Brunch</title>
<style>
  /* Self-hosted so the deck runs with no network at the venue.
     Fraunces + Anton — the same pairing as the London deck. */
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Anton-normal-400.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/Fraunces-normal-600.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/Fraunces-normal-900.woff2) format('woff2')}

  :root{
    /* sampled from the postcard's own vector artwork */
    --pink:#EF538E; --pink2:#D9376F; --pink-lt:#F8A9C4;
    --marigold:#FBC829; --chartreuse:#9CCB3B; --sage:#B7C0A8;
    --cream:#FDF6E7; --ink:#2A0A1E;
    --disp:'Fraunces',Georgia,serif; --cond:'Anton',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);font-family:var(--disp);cursor:none}

  /* ===== GROUND — the shoot, full bleed, in the slot the original gives its
     flat colour. A brand tint sits over it so each concept keeps a colour
     identity and the type always has a known value to sit on. ===== */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink)}
  #bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transition:opacity 1.1s ease;animation:drift 22s ease-out both}
  #bg img.on{opacity:1}
  @keyframes drift{0%{transform:scale(1.04)}100%{transform:scale(1.15) translate(-1.4%,-1.2%)}}
  #tint{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background .6s ease}
  .t0 #tint,.t3 #tint{background:rgba(239,83,142,.72)}
  .t1 #tint,.t7 #tint{background:rgba(251,200,41,.78)}
  .t2 #tint{background:rgba(253,246,231,.80)}
  .t4 #tint,.t8 #tint{background:rgba(217,55,111,.74)}
  .t5 #tint{background:rgba(156,203,59,.76)}
  .t6 #tint{background:rgba(20,6,14,.74)}
  .t9 #tint{background:rgba(12,3,9,.78)}
  .t10 #tint{background:radial-gradient(120% 90% at 50% 22%,#F76BA4 0%,#EF538E 48%,#D9376F 100%)}
  .t11 #tint{background:radial-gradient(120% 90% at 50% 40%,#F76BA4 0%,#EF538E 55%,#D9376F 100%)}
  .t12 #tint{background:rgba(42,10,30,.12)}   /* the shoot — photography almost clean */

  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;background:transparent;z-index:3}
  .q{font-family:var(--disp);font-weight:900;line-height:.95;letter-spacing:-.015em;padding:0 7vw;
    max-width:90vw;text-wrap:balance}
  .qb{display:flex;flex-direction:column;align-items:center;max-width:92vw;padding:0 4vw;
    position:relative;z-index:3}

  /* ===== BRAND CHROME (persistent) ===== */
  #logo{position:fixed;left:50%;top:1.8vh;transform:translateX(-50%);z-index:60;pointer-events:none}
  #logo img{height:14vh;display:block;filter:drop-shadow(0 .5vh 1.6vh rgba(42,10,30,.34))}
  .c10 #logo{display:none}  /* the opener carries its own centred lockup */
  .mascot{position:fixed;right:22px;top:14px;width:104px;height:auto;z-index:6;
    animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 .8vh 1.8vh rgba(42,10,30,.4))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  .corner{position:fixed;z-index:6;pointer-events:none;filter:drop-shadow(0 .8vh 1.8vh rgba(42,10,30,.4))}
  .cBall{left:26px;bottom:10vh;width:88px}
  /* the slot the original gives its rotating pin */
  #wandProp{position:fixed;right:2.2vw;bottom:9vh;height:27vh;z-index:6;pointer-events:none;
    filter:drop-shadow(0 1vh 2.2vh rgba(42,10,30,.45));
    animation:pinpop .6s cubic-bezier(.2,1.5,.35,1) both}
  @keyframes pinpop{0%{transform:scale(.4) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .c10 #wandProp,.c11 #wandProp{display:none}
  .c11 .mascot,.c11 .corner{display:none}
  .c12 .mascot,.c12 .corner,.c12 #wandProp{display:none}

  #foot{position:fixed;left:0;right:0;bottom:0;height:7.2vh;min-height:52px;background:var(--marigold);z-index:60;
    display:flex;align-items:center;overflow:hidden;border-top:3px solid var(--cream)}
  #foot .run{white-space:nowrap;font-family:var(--cond);color:var(--pink2);font-size:3.4vh;letter-spacing:.06em;
    animation:run 30s linear infinite;text-transform:uppercase}
  #foot .run span{padding:0 1.6vw}
  @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  #name{position:fixed;left:20px;top:16px;color:rgba(255,255,255,.8);font-family:var(--cond);
    font-size:14px;letter-spacing:.3em;text-transform:uppercase;z-index:61;mix-blend-mode:difference;
    transition:opacity .4s}
  #hud{position:fixed;left:0;right:0;bottom:8.4vh;text-align:center;color:rgba(0,0,0,.4);font-family:var(--cond);
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;z-index:61;transition:opacity .4s}
  .idle #hud,.idle #name{opacity:0}

  /* ===== CONCEPTS ===== */
  .c0 .q{color:var(--marigold);font-size:11vw;animation:slam .5s cubic-bezier(.2,1.4,.3,1) both;
    text-shadow:0 .3vh 2.4vh rgba(42,10,30,.4)}
  @keyframes slam{0%{transform:scale(2.3);opacity:0}100%{transform:scale(1);opacity:1}}

  .c2 .q{color:var(--pink2);font-size:10vw}
  .c2 .w{display:inline-block;transform-origin:50% 0;animation:flip .55s ease both}
  @keyframes flip{0%{transform:rotateX(-95deg);opacity:0}100%{transform:rotateX(0);opacity:1}}

  .c3 .q{color:var(--cream);font-size:10vw;position:relative;z-index:3;
    text-shadow:0 .6vh 2.6vh rgba(42,10,30,.4)}
  .drop{position:absolute;top:-14vh;z-index:1;animation:fall linear infinite}
  .drop img{display:block;width:100%;height:auto}
  @keyframes fall{to{transform:translateY(128vh) rotate(300deg)}}

  .c4 .q{font-size:10vw;color:rgba(253,246,231,.26)}
  .c4 .w{transition:color .25s,text-shadow .25s}
  .c4 .w.on{color:var(--marigold);text-shadow:0 0 30px rgba(251,200,41,.55)}

  .c5 .q{color:var(--ink);font-size:10vw}

  .c6 .q{font-size:10vw;color:#ffe6f1;
    text-shadow:0 0 8px #ff6fb8,0 0 22px var(--pink),0 0 60px var(--pink),0 0 110px var(--pink2);
    animation:flick 3s infinite}
  @keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.4}}

  .c7 .q{font-size:9.5vw;line-height:1.04}
  .c7 .w{display:inline-block;margin:0 .12em;padding:.02em .2em;border-radius:9px}

  .c8{align-items:flex-start}
  .c8 .scroll{position:absolute;width:100%;text-align:center;animation:up 32s linear infinite}
  .c8 .scroll p{font-family:var(--disp);font-weight:900;font-size:6.6vh;color:var(--cream);
    padding:3vh 8vw;line-height:1.02;text-shadow:0 .4vh 2.2vh rgba(42,10,30,.4)}
  .c8 .scroll p:nth-child(3n){color:var(--marigold)}
  @keyframes up{0%{transform:translateY(100vh)}100%{transform:translateY(-100%)}}

  /* Chromatic aberration via text-shadow rather than duplicated pseudo-elements.
     The duplicates wrapped differently from the real text and smeared it into
     an unreadable mess; shadows track the glyphs exactly and stay legible. */
  .c9 .q{font-size:10.5vw;color:var(--cream);
    text-shadow:2px 0 rgba(255,45,155,.62), -2px 0 rgba(168,226,31,.55), 0 .4vh 2.4vh rgba(0,0,0,.45);
    animation:gjit 2.6s steps(1) infinite}
  @keyframes gjit{
    0%,88%{transform:translate(0)}
    90%{transform:translate(-3px,1px)} 92%{transform:translate(2px,-1px)}
    94%{transform:translate(-1px,0)}   96%,100%{transform:translate(0)}
  }

  /* ===== OPENER (c10) — mirrors the original's truck slide ===== */
  .c10 .openslide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:5vh}
  .c10 .tline{font-family:var(--cond);color:var(--marigold);font-size:6.2vh;letter-spacing:.02em;
    text-transform:uppercase;text-align:center;line-height:.95;min-height:11vh;padding:0 6vw;
    text-shadow:3px 4px 0 var(--ink);animation:tlinein .5s cubic-bezier(.2,1.5,.35,1) both}
  .c10 .bigwm{height:22vh;margin-top:.4vh;filter:drop-shadow(0 1vh 2.4vh rgba(42,10,30,.42));
    animation:wmpin .6s cubic-bezier(.2,1.5,.35,1) both}
  .c10 .unitwrap{position:absolute;left:0;right:0;bottom:7.8vh;display:flex;justify-content:center;
    animation:drivein 1.05s cubic-bezier(.18,.85,.2,1) both}
  .c10 .unitimg{height:56vh;filter:drop-shadow(0 16px 26px rgba(42,10,30,.4));
    animation:bobunit 3.6s ease-in-out infinite}
  @keyframes tlinein{0%{transform:translateY(-26px) scale(.82);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wmpin{0%{transform:scale(.55) rotate(-5deg);opacity:0}100%{transform:none;opacity:1}}
  @keyframes drivein{0%{transform:translateX(-118vw)}100%{transform:translateX(0)}}
  @keyframes bobunit{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* ===== FINALE (c11) — the colourful campaign pieces and the mascots.
     All portrait 4:5, so they are shown whole on the pink rather than cropped
     to fill a 16:9 frame. ===== */
  .c11 #stage{padding:9vh 4vw 11vh}
  .c11 .plate{height:74vh;width:auto;border-radius:1.4vh;box-shadow:0 3vh 6vh rgba(42,10,30,.42);
    animation:plate .8s cubic-bezier(.16,1,.3,1) both}
  @keyframes plate{0%{opacity:0;transform:translateY(2.4vh) scale(.97)}100%{opacity:1;transform:none}}
  .c11 .cap{position:absolute;left:50%;transform:translateX(-50%);bottom:8.8vh;
    font-family:var(--cond);font-size:2.6vh;letter-spacing:.28em;text-transform:uppercase;
    color:var(--marigold);text-shadow:0 .3vh 2vh rgba(42,10,30,.5);z-index:4}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="tint"></div>
<div id="logo"><img src="art/logo-cream.png" alt="Nancy"></div>
<img class="mascot" src="art/ball-green.svg" alt="">
<div id="name"></div>
<img class="corner cBall" src="art/ball-pink.svg" alt="">
<img id="wandProp" src="art/wand-unit.svg" alt="">
<div id="stage"></div>
<div id="hud">1–9 + 0 · T opener · S shoot · C closer · ←/→ line · space pause · F fullscreen</div>
<div id="foot"><div class="run"></div></div>

<script>
/* ============================================================================
   NANCY — NY BRUNCH PROJECTOR
   The London deck's shape: a ground that changes per concept, Fraunces
   slammed large, Anton on the chrome, and the same persistent furniture —
   lockup top-centre, bobbing sprites in the lower corners, ticker along
   the foot.

   The difference: the ground is the product shoot rather than flat colour.
   Each concept gets its own frame full-bleed with a brand tint over it, so
   the photography carries the whole loop while every concept keeps a colour
   identity and the type always has a known value to sit on.

   Engine contract: a concept's f() renders into #stage and returns a teardown
   that show() runs before the next one starts.
   ========================================================================== */

/* ---- CONTENT --------------------------------------------------------------
   Two independent lists. Adding a line to one adds it nowhere else. */

const SCRIPT = [
  "At this club, love means everything, and every point is yours to play.",
  "Start slow. Warm up. Take the long rally.",
  "Find the sweet spot nobody else can reach.",
  "Play singles or mixed doubles.",
  "Hold serve, or break it.",
  "No faults here. No lines you can't call.",
  "And when it's match point, take it.",
  "Advantage, you.",
  "Game. Set. Yours.",
  "Second serves are for tennis.",
  "With Nancy, one is enough.",
  "Love — Love. Not on our watch."
];

// Opener taglines, swapping over the wand the way London's swap over the truck.
const TAGS = ["SMASH THE QUIET","ACE THE POINT","SECOND SERVES ARE FOR TENNIS",
              "WITH NANCY, ONE IS ENOUGH","LOVE — LOVE. NOT ON OUR WATCH",
              "FIND THE SWEET SPOT","ADVANTAGE, YOU","GAME. SET. YOURS."];

// TODO: venue + date once confirmed.
const TICKER = ["Smash the Quiet","Ace the Point","Second serves are for tennis",
                "With Nancy, one is enough","Love — Love, not on our watch",
                "Advantage, you","Game. Set. Yours.","NY Brunch"];

/* ---- ASSETS --------------------------------------------------------------- */
const A = p => "assets/" + p;
const SHOTS = ["court-ace-corner.jpg","court-ace-wide.jpg","court-ace-pink.jpg","court-ace-yellow.jpg",
               "court-smash.jpg","court-smash-wide.jpg","studio-ace-pink.jpg","studio-ace-solo.jpg",
               "studio-ace-yellow.jpg","studio-ball-yellow.jpg","studio-trio.jpg","studio-pile.jpg",
               "studio-pile-wide.jpg","flatlay-court.jpg","flatlay-fruit.jpg","flatlay-full.jpg",
               "flatlay-spread.jpg","racket-shadow.jpg","racket-balls.jpg","racket-flatlay.jpg",
               "net-smash.jpg","packaging.jpg","packaging-wide.jpg"];
const BALLS = ["art/ball-green.svg","art/ball-pink.svg","art/ball-green2.svg"];

// The campaign's colourful pieces, and the mascots. All portrait 4:5.
const COLOURFUL = [
  {f:"hero-chartreuse.jpg", c:"Smash the Quiet"},
  {f:"hero-pink.jpg",       c:"Ace the Point"},
  {f:"product-court.jpg",   c:"Second serves are for tennis"},
  {f:"mascot-duo.jpg",      c:"Ace — Love, Love"},
  {f:"mascot-trio.jpg",     c:"Smash & Ace"},
  {f:"mascot-hero.jpg",     c:"Smash"}
];

[...SHOTS, ...COLOURFUL.map(x => x.f)].forEach(s => { new Image().src = A(s); });

/* ---- HELPERS -------------------------------------------------------------- */
const stage  = document.getElementById('stage'),
      bgEl   = document.getElementById('bg'),
      nameEl = document.getElementById('name'),
      logoEl = document.querySelector('#logo img'),
      RANSOM = ['#EF538E','#FBC829','#FDF6E7','#2A0A1E','#9CCB3B'];

let li = 0, cur = 0, cleanup = null, autoTimer = null, paused = false;

const rand = a => a[Math.floor(Math.random() * a.length)];
const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

// Size off character count. Crude ladder, but it holds across the whole script —
// check any new line on the real display rather than trusting it.
function fitLen(el, t){
  if (!el) return;
  const n = (t || '').length;
  el.style.fontSize = (n < 13 ? 10.5 : n < 21 ? 8.5 : n < 31 ? 6.8 : n < 43 ? 5.4 : 4.6) + 'vw';
}
const fq = () => stage.querySelector('.q');
const words = s => s.split(' ');
const block = inner => `<div class="qb"><div class="q">${inner}</div></div>`;

function bgPhoto(src){
  const img = document.createElement('img');
  img.src = A(src); img.alt = '';
  bgEl.appendChild(img);
  requestAnimationFrame(() => img.classList.add('on'));
  while (bgEl.children.length > 2) bgEl.removeChild(bgEl.firstChild);
}

function cycle(render, ms, shots){
  render(li);
  let s = 0;
  const id = setInterval(() => {
    li = (li + 1) % SCRIPT.length;
    if (shots) bgPhoto(SHOTS[(++s * 7 + cur) % SHOTS.length]);   // a new frame each line
    render(li);
  }, ms);
  return () => clearInterval(id);
}

/* ---- CONCEPTS -------------------------------------------------------------
   c = the concept's tint + treatment class. */

const C = [
  {n:'Opener', c:10, f:() => {
    let k = 0;
    stage.innerHTML = `<div class="openslide">
      <div class="tline">★ ${TAGS[0]} ★</div>
      <img class="bigwm" src="art/logo-cream.png" alt="Nancy">
      <div class="unitwrap"><img class="unitimg" src="art/smash-ace-hero.png" alt="Smash and Ace"></div></div>`;
    const tl = stage.querySelector('.tline');
    const id = setInterval(() => {
      k = (k + 1) % TAGS.length;
      tl.style.animation = 'none'; void tl.offsetWidth; tl.style.animation = '';
      tl.textContent = '★ ' + TAGS[k] + ' ★';
    }, 2300);
    return () => clearInterval(id);
  }},

  {n:'Slam', c:0, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]));
    fitLen(fq(), SCRIPT[i]);
  }, 3800, true)},

  {n:'Split-flap', c:2, f:() => cycle(i => {
    stage.innerHTML = block(words(SCRIPT[i]).map((w,j) =>
      `<span class="w" style="animation-delay:${j*.07}s">${esc(w)}&nbsp;</span>`).join(''));
    fitLen(fq(), SCRIPT[i]);
  }, 3000, true)},

  {n:'Ball rain', c:3, f:() => {
    let drops = '';
    for (let i = 0; i < 24; i++){
      drops += `<div class="drop" style="left:${Math.random()*100}vw;width:${5+Math.random()*7}vh;` +
               `animation-duration:${3.4+Math.random()*4}s;animation-delay:${-Math.random()*7}s">` +
               `<img src="${BALLS[i % BALLS.length]}" alt=""></div>`;
    }
    const stop = cycle(i => {
      const old = stage.querySelector('.qb'); if (old) old.remove();
      stage.insertAdjacentHTML('beforeend', block(esc(SCRIPT[i])));
      fitLen(fq(), SCRIPT[i]);
    }, 3800, true);
    stage.insertAdjacentHTML('afterbegin', drops);
    return stop;
  }},

  {n:'Karaoke', c:4, f:() => {
    let t = [];
    const render = i => {
      stage.innerHTML = block(words(SCRIPT[i]).map(w => `<span class="w">${esc(w)}</span>`).join(' '));
      fitLen(fq(), SCRIPT[i]);
      stage.querySelectorAll('.q .w').forEach((w,j) => {
        t.push(setTimeout(() => w.classList.add('on'), 250 + j*240));
      });
    };
    render(li);
    let s = 0;
    const iv = setInterval(() => {
      t.forEach(clearTimeout); t = [];
      li = (li + 1) % SCRIPT.length;
      bgPhoto(SHOTS[(++s * 7 + cur) % SHOTS.length]);
      render(li);
    }, 4000);
    return () => { clearInterval(iv); t.forEach(clearTimeout); };
  }},

  {n:'Court', c:5, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]));
    fitLen(fq(), SCRIPT[i]);
  }, 3600, true)},

  {n:'Neon', c:6, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]));
    fitLen(fq(), SCRIPT[i]);
  }, 3800, true)},

  {n:'Ransom', c:7, f:() => cycle(i => {
    stage.innerHTML = block(words(SCRIPT[i]).map(w => {
      const fs  = (.78 + Math.random()*.8).toFixed(2);
      const rot = (Math.random()*14 - 7).toFixed(1);
      const bg  = rand(RANSOM);
      const fg  = (bg === '#FBC829' || bg === '#FDF6E7') ? '#2A0A1E' : '#FDF6E7';
      return `<span class="w" style="font-size:${fs}em;transform:rotate(${rot}deg);background:${bg};color:${fg}">${esc(w)}</span>`;
    }).join(''));
    fitLen(fq(), SCRIPT[i]);
  }, 2900, true)},

  {n:'Credits', c:8, f:() => {
    stage.innerHTML = `<div class="scroll">` + SCRIPT.map(t => `<p>${esc(t)}</p>`).join('') + `</div>`;
    return () => {};
  }},

  {n:'Glitch', c:9, f:() => cycle(i => {
    stage.innerHTML = block(esc(SCRIPT[i]));
    fitLen(fq(), SCRIPT[i]);
  }, 3400, true)},

  {n:'The shoot', c:12, f:() => {
    let k = Math.floor(Math.random() * SHOTS.length);
    bgPhoto(SHOTS[k % SHOTS.length]);
    stage.innerHTML = '';
    const id = setInterval(() => { k++; bgPhoto(SHOTS[k % SHOTS.length]); }, 3800);
    return () => clearInterval(id);
  }},

  // The closer: the campaign's colourful pieces and the mascot cast, shown
  // whole on the pink rather than cropped into a 16:9 ground.
  {n:'Colourful ones', c:11, hold:22500, f:() => {
    let k = 0;
    const render = () => {
      const it = COLOURFUL[k % COLOURFUL.length];
      stage.innerHTML = `<img class="plate" src="${A(it.f)}" alt="">` +
                        `<div class="cap">${esc(it.c)}</div>`;
    };
    render();
    const id = setInterval(() => { k++; render(); }, 3400);
    return () => clearInterval(id);
  }}
];

/* ---- LOOP ----------------------------------------------------------------- */

// Tints the type reads dark against — the logo and corner sprites flip on these
// so nothing ever sits colour-on-colour.
const LIGHT_TINTS = [1, 2, 5, 7];

function show(i){
  if (cleanup) cleanup();
  cur = (i + C.length) % C.length;
  const cc = C[cur].c;

  stage.className = ''; void stage.offsetWidth; stage.className = 'c' + cc;
  document.body.className = (document.body.classList.contains('idle') ? 'idle ' : '') + 'c' + cc + ' t' + cc;

  if (cc !== 10 && cc !== 11 && cc !== 12) bgPhoto(SHOTS[(cur * 5 + 3) % SHOTS.length]);

  const light = LIGHT_TINTS.includes(cc);
  logoEl.src = light ? 'art/logo-ink.png' : 'art/logo-cream.png';
  // Green sprite on a green ground vanished; pick each corner's ball against
  // the tint it actually sits on.
  document.querySelector('.mascot').src = (cc === 5) ? 'art/ball-pink.svg'  : 'art/ball-green.svg';
  document.querySelector('.cBall').src  = (cc === 0 || cc === 3 || cc === 4 || cc === 8)
                                          ? 'art/ball-green2.svg' : 'art/ball-pink.svg';

  stage.innerHTML = '';
  nameEl.textContent = (cur + 1 < 10 ? '0' : '') + (cur + 1) + ' · ' + C[cur].n;
  cleanup = C[cur].f();
}

function nextC(){ show(cur + 1); }
function startAuto(){
  clearInterval(autoTimer);
  autoTimer = setInterval(() => { if (!paused) nextC(); }, C[cur].hold || 14000);
}

document.querySelector('#foot .run').innerHTML = (() => {
  const t = ' ★ ' + TICKER.join(' ★ ') + ' ';
  return `<span>${t}</span><span>${t}</span>`;
})();

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9'){ show(+e.key - 1); startAuto(); }
  else if (e.key === '0'){ show(9); startAuto(); }
  else if (e.key.toLowerCase() === 's'){ show(10); startAuto(); }
  else if (e.key.toLowerCase() === 'c'){ show(11); startAuto(); }
  else if (e.key === 'ArrowRight'){ li = (li + 1) % SCRIPT.length; show(cur); startAuto(); }
  else if (e.key === 'ArrowLeft'){ li = (li - 2 + SCRIPT.length) % SCRIPT.length; show(cur); startAuto(); }
  else if (e.key === ' '){ paused = !paused; e.preventDefault(); }
  else if (e.key.toLowerCase() === 't'){ show(0); startAuto(); }
  else if (e.key.toLowerCase() === 'f'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let idle;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add('idle'), 2500);
}
document.addEventListener('mousemove', wake);
document.addEventListener('keydown', wake);
wake();

show(0);
startAuto();
</script>
</body>
</html>
